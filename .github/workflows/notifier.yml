name: roblox-notifier

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 min (GitHub puede demorarlo unos minutos)
  workflow_dispatch:

permissions:
  contents: write            # para guardar state.json

concurrency:
  group: roblox-notifier
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Revisar presencia y avisar
        run: python roblox_notifier.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Guardar estado (evita correos repetidos)
        run: |
          git config user.name "notifier-bot"
          git config user.email "notifier-bot@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || (git commit -m "update state" && git push)
